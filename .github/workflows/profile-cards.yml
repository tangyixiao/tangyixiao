name: Refresh profile cards

on:
  push:
    paths:
      - .github/workflows/profile-cards.yml
      - scripts/profile-cards/**
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:

concurrency:
  group: profile-cards-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test generator and credit rules
        run: python -B -m unittest discover -s tests -p test_profile_card_generator.py
      - name: Isometric contribution calendar
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: tangyixiao
          filename: isometric.svg
          output_action: none
          base: ''
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Shanghai
          config_animations: no
          config_padding: 8, 8 + 0%
          plugins_errors_fatal: yes
          retries: 1
          extras_css: |
            svg { color: #455467; } h1,h2,h3 { color: #45648a; }
            @media (prefers-color-scheme: dark) {
              svg { color: #c5cdd7; } h1,h2,h3 { color: #9db9d1; }
            }
      - name: Three-dimensional contribution landscape
        uses: yoshi389111/github-profile-3d-contrib@e235d118909be71eb7edb05482a3de4e76156df3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: tangyixiao
          MAX_REPOS: '1000'
          SETTING_JSON: scripts/profile-cards/landscape.json
      - name: Collect generated calendars
        run: |
          mkdir -p assets/generated
          cp /metrics_renders/isometric.svg assets/generated/isometric.svg
          cp profile-3d-contrib/contribution-3d-light.svg assets/generated/contribution-3d-light.svg
          cp profile-3d-contrib/contribution-3d-dark.svg assets/generated/contribution-3d-dark.svg
      - name: Generate articles from public blog source and validate all cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/profile-cards/generate_articles.py --validate-all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: profile-cards
          path: assets/generated/
          if-no-files-found: error
          retention-days: 3

  publish:
    if: github.ref == 'refs/heads/main'
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: profile-cards
          path: work/generated-cards
      - name: Validate and publish only generated card files
        run: |
          python scripts/profile-cards/generate_articles.py --publish-from work/generated-cards
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/generated/
          if git diff --cached --quiet; then
            echo 'Cards unchanged; no commit needed.'
            exit 0
          fi
          python scripts/profile-cards/generate_articles.py --commit-message work/profile-card-commit.txt
          git commit --file work/profile-card-commit.txt
          git push origin HEAD:main
